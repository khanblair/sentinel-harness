[package]
name = "sentinel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "sentinel"
path = "src/main.rs"

[features]
window = ["dep:tao", "dep:wry", "dep:muda"]

[dependencies]
sentinel-core = { path = "../sentinel-core" }
sentinel-daemon = { path = "../sentinel-daemon" }
sentinel-mcp = { path = "../sentinel-mcp" }
anyhow = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true, optional = true }
tao = { workspace = true, optional = true }
wry = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
