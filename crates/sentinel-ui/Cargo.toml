[package]
name = "sentinel-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sentinel-core = { path = "../sentinel-core" }
console_error_panic_hook = { workspace = true }
gloo-net = { workspace = true }
gloo-storage = { workspace = true }
gloo-timers = { workspace = true }
js-sys = { workspace = true }
leptos = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement",
    "Location", "Navigator", "MediaQueryList", "Storage", "KeyboardEvent", "Event", "EventTarget",
    "CssStyleDeclaration", "DomRect", "Clipboard", "VisibilityState",
] }

[lints]
workspace = true
