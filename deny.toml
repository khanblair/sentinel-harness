# Only place for the banned crate list (see docs/library-docs.md, Banned Libraries).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Hackathon rule: no prebuilt multi-agent orchestration framework.
    { crate = "rig-core" },
    { crate = "swarms-rs" },
    { crate = "agentai" },
    { crate = "langchain-rust" },
    # Heavy native build, not needed: we shell out to git.
    { crate = "git2" },
    { crate = "libgit2-sys" },
    # TLS comes from rustls only.
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    # Superseded by std::sync::LazyLock.
    { crate = "lazy_static" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
