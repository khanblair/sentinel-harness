# Only place for the banned crate list (see docs/library-docs.md, Banned Libraries).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates that come in through other crates. None is a known vulnerability. Recheck
# when leptos and the keyring crate move on (see docs/progress-tracker.md, Notes for Later).
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is a build-time macro crate used by the UI framework" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant_derive comes in through the Linux secret service keychain client" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names comes in through the Linux secret service keychain client" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant comes in through the Linux secret service keychain client" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is a build-time macro crate of the Linux GTK bindings that wry lists. It is not built on macOS, where the window feature is the only user" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Hackathon rule: no prebuilt multi-agent orchestration framework.
    { crate = "rig-core" },
    { crate = "swarms-rs" },
    { crate = "agentai" },
    { crate = "langchain-rust" },
    # Heavy native build, not needed: we shell out to git.
    { crate = "git2" },
    { crate = "libgit2-sys" },
    # TLS comes from rustls only.
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    # Superseded by std::sync::LazyLock. Only the test mock server (wiremock, through deadpool) uses it.
    { crate = "lazy_static", wrappers = ["deadpool"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
