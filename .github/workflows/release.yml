name: release

# Builds an installable, signed macOS disk image (Sentinel.dmg) on a GitHub-hosted Mac, so a
# release build never runs on the owner's own computer. Linux and Windows builds are left out for
# now.
#
# The disk image holds Sentinel.app: a universal binary (Apple silicon and Intel) with the UI
# embedded. Opening the app picks a project, serves it on this Mac, and opens the UI in the browser
# (`sentinel app`, docs/development.md "Release Steps").
#
# Triggers: pushing a tag that looks like a version ("v0.1.0"), or running this workflow by hand
# from the Actions tab with a "tag" input. Both publish a release with the .dmg attached, and the
# .dmg is also an artifact of the run. The release step is the last one, so a failed build, a failed
# notarization, or a failed launch check stops the run and publishes nothing. A published release
# becomes what the install script and the "latest" link serve at once.
#
# Signing. With the secrets below the app and the image are signed with a Developer ID
# certificate and notarized, so macOS opens them without a warning. Without them the build still
# runs and signs ad hoc: the image works, but macOS blocks the first open until you choose Open
# Anyway in System Settings, Privacy & Security (or run xattr -dr com.apple.quarantine on the app). Add the secrets in Settings, Secrets and variables, Actions:
#   APPLE_CERTIFICATE           the "Developer ID Application" certificate as a .p12 file, base64
#   APPLE_CERTIFICATE_PASSWORD  the password of that .p12 file
#   APPLE_ID                    the Apple ID that is in the Apple Developer Program
#   APPLE_TEAM_ID               the 10 character team id
#   APPLE_APP_PASSWORD          an app-specific password for that Apple ID (notarization)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for this build (for example v0.1.2). Publishes a release when every step passes."
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-dmg:
    name: Sentinel.dmg (macOS, universal)
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release tag and version
        id: tag
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build the UI, then the binary for each Mac that embeds it
        run: |
          (cd crates/sentinel-ui && trunk build --release)
          cargo build --release -p sentinel-cli --features window --target aarch64-apple-darwin
          cargo build --release -p sentinel-cli --features window --target x86_64-apple-darwin

      - name: Join the two binaries into one universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/sentinel \
            target/aarch64-apple-darwin/release/sentinel \
            target/x86_64-apple-darwin/release/sentinel
          lipo -info dist/sentinel

      - name: Import the signing certificate
        id: cert
        if: env.APPLE_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          if [ -z "$identity" ]; then
            echo "The certificate holds no 'Developer ID Application' identity." >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Build the app
        env:
          SIGNING_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          packaging/macos/build-app.sh dist/sentinel "${{ steps.tag.outputs.version }}" \
            "${{ github.run_number }}" dist

      # Notarize the app first and staple the ticket to it, so the copy inside the image also opens
      # offline. Then the image is notarized too. The script prints Apple's log when Apple says no,
      # and checks with Gatekeeper itself (spctl) that the result opens. A failure here fails the run.
      - name: Notarize the app
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: packaging/macos/notarize.sh dist/Sentinel.app

      - name: Build the disk image
        env:
          SIGNING_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: packaging/macos/make-dmg.sh dist/Sentinel.app "dist/Sentinel-${{ steps.tag.outputs.version }}.dmg"

      - name: Notarize the disk image
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: packaging/macos/notarize.sh "dist/Sentinel-${{ steps.tag.outputs.version }}.dmg"

      # A real launch catches a broken window or web view that a compile cannot. The daemon is
      # stopped through the same quit path a person uses. The step needs the page to load AND a clean
      # exit (code 0), so a crash on quit fails the run and nothing is published.
      - name: Launch the app once
        run: |
          dmg="dist/Sentinel-${{ steps.tag.outputs.version }}.dmg"
          mount="$RUNNER_TEMP/sentinel-dmg"
          repo="$RUNNER_TEMP/smoke-repo"
          log="$RUNNER_TEMP/window-smoke.log"
          mkdir -p "$mount"
          set +e
          {
            hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly &&
            cp -R "$mount/Sentinel.app" "$RUNNER_TEMP/Sentinel.app" &&
            hdiutil detach "$mount" &&
            git init -b main "$repo" &&
            git -C "$repo" config user.name "Sentinel" &&
            git -C "$repo" config user.email "sentinel@example.invalid" &&
            git -C "$repo" commit --allow-empty -m "smoke" &&
            SENTINEL_WINDOW_SMOKE=1 perl -e 'alarm 90; exec @ARGV' \
              "$RUNNER_TEMP/Sentinel.app/Contents/MacOS/sentinel" app --repo "$repo" > "$log" 2>&1
          }
          status=$?
          if grep -q WINDOW_LOADED "$log" 2>/dev/null && [ "$status" -eq 0 ]; then
            echo "Window smoke: the page loaded and the app quit cleanly." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -eq 142 ] || [ "$status" -eq 124 ]; then
            echo "Window smoke: timed out after 90 seconds." >> "$GITHUB_STEP_SUMMARY"
            tail -20 "$log" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "Window smoke: the page did not load (exit $status)." >> "$GITHUB_STEP_SUMMARY"
            tail -20 "$log" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Say what was built
        run: |
          dmg="dist/Sentinel-${{ steps.tag.outputs.version }}.dmg"
          (cd dist && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256")
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            echo "Signed with a Developer ID certificate and notarized." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Signed with a Developer ID certificate. Not notarized: the notarization secrets are missing." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Signed ad hoc. The signing secrets are not set, so macOS blocks the first open: choose Open Anyway in System Settings, Privacy and Security." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Sentinel-macOS-dmg
          path: |
            dist/Sentinel-${{ steps.tag.outputs.version }}.dmg
            dist/Sentinel-${{ steps.tag.outputs.version }}.dmg.sha256
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          draft: false
          make_latest: true
          files: |
            dist/Sentinel-${{ steps.tag.outputs.version }}.dmg
            dist/Sentinel-${{ steps.tag.outputs.version }}.dmg.sha256
