name: ci

# The checks of `cargo xtask ci`, split into jobs that run side by side, so the whole run takes as
# long as its slowest job and not the sum of them (docs/development.md). CI runs here on GitHub,
# never on the owner's computer. The release build is a separate workflow (release.yml) and does
# not wait for this one.
#
#   lint    format and clippy
#   test    the test suite on Linux
#   checks  cargo-deny, cargo-machete, and the repository checks (smell, dup, slop, doc, ban, contrast)
#   ui      clippy for the browser build, then the WASM bundle and its size budget
#   test-os the test suite on macOS and Windows, after lint and test pass

on:
  pull_request:
  push:
    branches: [main]

# The build cache is saved even when a job fails or times out (cache-on-failure). Without it, a job
# that runs out of time saves nothing, and the next run starts cold again.
#
# A newer push to a pull request replaces its older run. A push to main never cancels the run
# before it: a cancelled run saves no build cache, and the next run would start cold again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug info is not read in CI. Leaving it out makes the test binaries link faster.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  lint:
    name: lint (format, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Real git runs in these tests. Give it an identity so commits work on a clean runner.
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@localhost"
          git config --global init.defaultBranch main
      # Two steps, so a slow build and a stuck test are told apart. Two build jobs keep the linker
      # inside the memory of the runner. A first run died with "lost communication", which means
      # the runner ran out of CPU, memory, or disk, so the second step writes what the machine is
      # doing every 30 seconds and the logs are kept as an artifact.
      - name: Build the tests
        run: cargo nextest run --workspace --no-run
        env:
          CARGO_BUILD_JOBS: "2"
      - name: Run the tests
        run: |
          mkdir -p ci-logs
          (while true; do date -u; free -m | sed -n 1,2p; df -h / | tail -1; ps -eo pid,pcpu,pmem,etime,args --sort=-pcpu | head -6 | cut -c1-170; echo; sleep 30; done) > ci-logs/machine.log 2>&1 &
          set -o pipefail
          timeout 30m cargo nextest run --workspace --no-tests=pass --no-fail-fast --test-threads 2 2>&1 | tee ci-logs/nextest.log
      - name: Keep the test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: ci-logs
          if-no-files-found: ignore

  checks:
    name: checks (deny, machete, repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo deny check
      - run: cargo machete
      - run: cargo xtask checks

  ui:
    name: ui (wasm clippy, bundle and size budget)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: cargo clippy -p sentinel-ui --target wasm32-unknown-unknown -- -D warnings
      - run: trunk build --release
        working-directory: crates/sentinel-ui
      # Budget from docs/architecture.md: the UI bundle stays under 2 MB compressed.
      - run: |
          size=$(find crates/sentinel-ui/dist -name '*.wasm' -print0 | xargs -0 gzip -9c | wc -c)
          echo "compressed wasm: ${size} bytes"
          test "$size" -lt 2000000
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: crates/sentinel-ui/dist

  test-os:
    name: tests (${{ matrix.os }})
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Real git runs in these tests. Give it an identity so commits work on a clean runner.
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@localhost"
      - run: cargo nextest run --workspace --no-tests=pass
