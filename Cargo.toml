[workspace]
resolver = "3"
members = ["xtask", "crates/*"]
default-members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
assert_cmd = "2.2.2"
axum = { version = "0.8.9", features = ["ws", "macros"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
globset = "0.4.20"
insta = "1.49.0"
keyring = "4.2.0"
notify = "8.2.0"
petgraph = "0.8.3"
proptest = "1.12.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rfd = "0.17.2"
rmcp = "3.7.0"
rusqlite = { version = "0.40.0", features = ["bundled"] }
rusqlite_migration = "2.6.0"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "serde-well-known", "macros", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "signal", "io-util", "io-std", "net"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
which = "8.0.6"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
wildcard_enum_match_arm = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
